name: Release

# Releasing is manual up to the tag:
#
#   1. booi scripts/bumpversion.boo minor     (commit and merge the result)
#   2. git tag v<version> && git push origin v<version>
#
# Pushing the tag runs this workflow. It checks the tag against version.txt,
# runs the CI suite, builds a tarball and a zip of a self contained build per platform, and
# publishes them to a GitHub release along with checksums and build provenance.
#
# The Boo.Sdk package is packed and tested here too, and published to nuget.org
# once the release exists using the Trusted Publishing workflow.
#
# Run by hand from the Actions tab, it builds and smoke tests the archives and
# the package without publishing anything.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version.txt
        id: version
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match version.txt ($version). Run scripts/bumpversion.boo before tagging."
            exit 1
          fi

  test:
    name: Test
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-x64,     os: macos-15-intel }
          - { rid: osx-arm64,   os: macos-latest }
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-11-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Package
        shell: bash
        run: scripts/package-release.sh ${{ matrix.rid }} artifacts

      # What a user gets is the archive, not the build tree, so test that.
      - name: Unpack the archive
        shell: bash
        run: |
          install="$RUNNER_TEMP/boo"
          mkdir -p "$install"
          archive=$(ls artifacts/boo-*-${{ matrix.rid }}.tar.gz)
          case "${{ matrix.rid }}" in
            win-*) tar --force-local -xzf "$archive" -C "$install" ;;
            *) tar -xzf "$archive" -C "$install" ;;
          esac
          echo "$install" >> "$GITHUB_PATH"

      - name: Smoke test the archive
        shell: bash
        run: scripts/smoke-test-release.sh "$RUNNER_TEMP/boo" artifacts/boo-*-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: boo-${{ matrix.rid }}
          path: artifacts/boo-*
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [verify, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: boo-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum boo-* > SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/boo-*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Boo ${{ needs.verify.outputs.version }}" \
            --generate-notes \
            --verify-tag

  pack-sdk:
    name: Boo.Sdk package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/Boo.Sdk/Boo.Sdk.csproj --configuration Release --output sdk-package

      - name: Smoke test the package
        run: scripts/smoke-test-sdk.sh sdk-package "${{ needs.verify.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-package
          path: sdk-package/*.nupkg
          if-no-files-found: error

  publish-sdk:
    name: Publish Boo.Sdk
    if: github.ref_type == 'tag'
    needs: [verify, test, pack-sdk, publish]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: sdk-package
          path: sdk-package

      - name: Check the NuGet account is named
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER repository variable to the nuget.org account that owns Boo.Sdk and has the trusted publishing policy."
            exit 1
          fi

      # Trades this run's identity for an API key that lasts a few minutes.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "sdk-package/Boo.Sdk.${{ needs.verify.outputs.version }}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
