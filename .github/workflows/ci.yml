name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the running job irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BOO_REQUIRE_ILVERIFY: 1

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install ilverify
        run: dotnet tool install --global dotnet-ilverify --version 10.0.11

      - name: Build
        run: dotnet build Boo.slnx --configuration Release

      - name: Test
        run: dotnet test Boo.slnx --configuration Release --no-build --logger "trx;LogFileName=${{ matrix.os }}.trx"

      # Excluded from the run above by VSTestTestCaseFilter: it parses every .boo
      # in the repository, which is too slow for an ordinary local build.
      - name: Test parser corpus
        run: dotnet test tests/Boo.Lang.Parser.Tests/Boo.Lang.Parser.Tests.booproj --configuration Release --no-build --filter "TestCategory=Corpus" --logger "trx;LogFileName=corpus-${{ matrix.os }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
